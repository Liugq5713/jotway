name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  # Version/build validation and publication must finish before another tag runs.
  group: release
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Read version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use vMAJOR.MINOR.PATCH: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require update signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "Configure the Jotway SPARKLE_PRIVATE_KEY Actions secret before publishing." >&2
            exit 1
          fi

      - name: Verify previous stable release version baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/website/publish-metadata.py \
            --repository "$GITHUB_REPOSITORY" \
            --version-baseline \
            --output "$RUNNER_TEMP/previous-release.json"

      - name: Build and verify public distribution DMG
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set +e
          ./scripts/release.py "${{ steps.version.outputs.version }}" \
            --ad-hoc \
            --previous-release "$RUNNER_TEMP/previous-release.json" \
            --notes "Jotway ${{ github.ref_name }} (ad-hoc application signing; unsigned DMG; not notarized by Apple)" \
            2>&1 | tee "$RUNNER_TEMP/release-build.log"
          release_codes=("${PIPESTATUS[@]}")
          release_status="${release_codes[0]}"
          if [ "$release_status" -eq 0 ]; then release_status="${release_codes[1]}"; fi
          if [ "$release_status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/release-build.log" <<'PY'
          from pathlib import Path
          import re, sys
          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          errors = [line for line in lines if re.search(r'(^|\s)error:|release 失败：', line)]
          for error in errors[:20]:
              escaped = error.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error::{escaped}')
          PY
          fi
          exit "$release_status"

      - name: Create checksum file
        shell: bash
        run: |
          release_dir="$(find release -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$release_dir"
          (cd "$release_dir" && shasum -a 256 *.dmg appcast.xml release.json > SHA256SUMS.txt)
          echo "RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jotway-${{ steps.version.outputs.version }}-arm64
          path: |
            ${{ env.RELEASE_DIR }}/*.dmg
            ${{ env.RELEASE_DIR }}/release.json
            ${{ env.RELEASE_DIR }}/appcast.xml
            ${{ env.RELEASE_DIR }}/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - "$RELEASE_DIR/release.json" <<'PY'
          import json, sys
          record = json.load(open(sys.argv[1]))
          assert record.get('codeSigning') == 'ad-hoc'
          assert record.get('dmgCodeSigning') == 'unsigned'
          assert record.get('updatesEnabled') is True
          assert all(record.get(key) is False for key in ('notarized', 'distributionVerified', 'stapled', 'gatekeeperAccepted'))
          PY
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Personal-developer build: the application uses ad-hoc signing. The DMG is unsigned and has not been notarized by Apple.

          macOS may block the first launch. Verify the source and SHA256SUMS.txt, then allow the app in System Settings → Privacy & Security if you trust the build.

          Sparkle update signatures and download checksums are verified independently of Apple signing.
          NOTES
          gh release create "${{ github.ref_name }}" \
            "$RELEASE_DIR"/*.dmg \
            "$RELEASE_DIR/release.json" \
            "$RELEASE_DIR/appcast.xml" \
            "$RELEASE_DIR/SHA256SUMS.txt" \
            --title "Jotway ${{ github.ref_name }}" \
            --verify-tag \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --generate-notes

      - name: Verify public download and build website artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/website/publish-metadata.py \
            --release "$RELEASE_DIR/release.json" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --allow-ad-hoc \
            --output "$RELEASE_DIR/website-release.json" \
            --appcast-output "$RUNNER_TEMP/appcast.xml"
          python3 scripts/website/build.py \
            --metadata "$RELEASE_DIR/website-release.json" \
            --appcast "$RUNNER_TEMP/appcast.xml"

      - name: Upload website for separate deployment
        uses: actions/upload-artifact@v4
        with:
          name: Jotway-website-${{ steps.version.outputs.version }}
          path: website/dist/
          if-no-files-found: error
