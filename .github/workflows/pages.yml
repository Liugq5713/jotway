name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/website/**'
      - 'Resources/Icons/AppIcon.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  release:
    types: [published, edited, released]
  # Releases created with GITHUB_TOKEN do not trigger another release workflow.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  # Skipped events must not replace a queued deployment.
  group: >-
    ${{ ((github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
    (github.event_name != 'release' || (!github.event.release.draft && !github.event.release.prerelease))) &&
    'pages' || format('pages-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  dispatch:
    # Release events run on a tag; Pages only permits deployments from main.
    if: github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Request website deployment from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: >-
      github.event_name != 'release' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/website/publish-metadata.py \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/website-release.json"

      - name: Build static website
        run: python3 scripts/website/build.py --metadata "$RUNNER_TEMP/website-release.json"

      - name: Check demo JavaScript syntax
        run: node --check website/src/site.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
