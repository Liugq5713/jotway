name: Release readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-readiness.yml'
      - 'scripts/ci-signing.py'
      - 'scripts/code_signing.py'
      - 'scripts/release.py'

permissions:
  contents: read

jobs:
  signing:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Developer ID and notarization credentials
        env:
          JOTWAY_SIGNING_IDENTITY: ${{ secrets.JOTWAY_SIGNING_IDENTITY || vars.JOTWAY_SIGNING_IDENTITY }}
          JOTWAY_SIGNING_CERTIFICATE_BASE64: ${{ secrets.JOTWAY_SIGNING_CERTIFICATE_BASE64 }}
          JOTWAY_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.JOTWAY_SIGNING_CERTIFICATE_PASSWORD }}
          JOTWAY_NOTARY_API_KEY_BASE64: ${{ secrets.JOTWAY_NOTARY_API_KEY_BASE64 }}
          JOTWAY_NOTARY_KEY_ID: ${{ secrets.JOTWAY_NOTARY_KEY_ID }}
          JOTWAY_NOTARY_ISSUER_ID: ${{ secrets.JOTWAY_NOTARY_ISSUER_ID }}
          JOTWAY_NOTARY_PROFILE: ${{ secrets.JOTWAY_NOTARY_PROFILE }}
        run: python3 scripts/ci-signing.py prepare

      - name: Clean release credentials
        if: always()
        run: python3 scripts/ci-signing.py cleanup
